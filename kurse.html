<!--Dokumententy: HTML5-->
<!DOCTYPE html>
<!--Beginn der Seite, Sprache Deutsch-->
<html lang="de">
<!--Kopfbereich: ANgaben über die Seite, die nicht im Fenster erscheinen.-->
<head>
<!--Zeichensatz UTF-8 für Umlaute und Sonderzeichen.-->
<meta charset="UTF-8">
<!--Darstellung auf Smartphones in Gerätebreite-->
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!--Titel der Seite: Text im Browser-Tab: Zuerst die Seite, dann der Name der Webseite-->
<title>Kurse - Meine Webseite</title>
<!--Beschreibung der Webseite: Wird in Suchmaschinen und KI Ergebnissen gelistet.-->
<meta name="description" content="Unsere Kurse auf einem Blick.">
<!--Dieselbe CSS-Datei für alle Seiten = Alle Seiten sehen gleich aus.-->
<link rel="stylesheet" href="css/style.css">
<!--Eigene JavaScript Datei für diese Seite.-->
<script src="js/daten.js" defer></script>

<script src="js/hilfsfunktionen.js" defer>    
</script>
<script src="js/rechner.js" defer></script>
<script src="js/kurskarten.js" defer></script>
<script src="js/kursauswahl.js" defer></script>
<script src="js/kurse.js" defer></script>
<script src="js/suche.js" defer></script>





<!--Ende des Kopfbereichs--></head>
<!--Sichtbarer Bereich-->
<body>
    <!--Sichtbarer Kopfbereich mit Name und Navigation. Auf allen Seiten geleich.-->
    <header>

        <div id="inner_header">

        <!--Sichtbarer Name der Webseite-->
        <h1>Meine Webseite</h1>
        <!--Bereich für die Navigation-->
        <nav>
            <!--Ungeorndete Liste (ul) mit den Links.-->
            <ul>
                <!--Listenpunkt (li) mit einem Link (a) zur Startseite.-->
                <li><a href="index.html">Start</a></li>
                <!--Link zur Unterseite Kurse-->
                <li><a href="kurse.html">Kurse</a></li>
                <!--Link zur Unterseite Kontakt-->
                <li><a href="kontakt.html">Kontakt</a></li>
                <!--Link zu einem Abschnitt der Startseite: Datei, # und die ID.-->
                <li><a href="index.html#id_kurse">Unser Angebot</a></li>
                <!--Link zur Unterseite Merkliste-->
                <li><a href="merkliste.html">Merkliste</a></li>
            <!--Ende der Liste.-->
            </ul>
        <!--Ende der Navigation-->
        </nav>
        </div>

    <!--Ende des Kopfbereichs-->
    </header>
    <!--Inhalt der Seite-->
    <main>
        <!--Überschrift der Seite-->
        <h2>Kurse</h2>
        <div id="suchleiste">
            <label for="suchfeld">Suche</label>
            <input type="text" id="suchfeld" placeholder="Kurs suchen...">
            <label><input type="checkbox" id="filter_frei">Nur Kurse mit freien Plätze</label>
            <label for="sortierung">Sortierung</label>
                <select id="sortierung">
                    <option value="standard">Standard</option>
                    <option value="preis_auf">Preis aufsteigend</option>
                    <option value="preis_ab">Preis absteigend</option>
                    <option value="name">Name A-Z</option>
                </select>

        </div>
        <!--Hier entstehen die Kurskarten-->
        <div id="kursliste"></div>

            <!--Hier erscheint ein Merkhinweis-->
            <p id="merkhinweis"></p>

            <!--Preisrechner-->
            <div id="rechner">
                <p>Rabattrechner</p>
                <!--Beschriftung für Dropdown Menü-->
                <label for="kursauswahl">Kurs auswählen:</label>
                <!--Dropdown Menü für Kursauswahl-->
                <select id="kursauswahl">
                    <!--Element im Dropdown Menü-->
                    <!--Weitere Elemente werden per JS hinzugefügt-->
                    <option value="">Bitte auswählen</option>
                </select>

                <p>Ab 3 Personen gibt es 10% Rabatt.</p>
                <!--Label beschriftet ein Eingabefeld, for nennt die id des Feldes.-->
                <label for="anzahl">Anzahl der Personen</label>
                <!--Eingabefeld für Text. placeholder: grauer Beispieltext im leeren Feld.-->
                <input id="anzahl" type="text" placeholder="z.B. 3">
                <!--Knopf: Ein Klick ruft die Funktion berechnePreis() aus kurse.js auf.-->
                <button onclick="berechnePreis()">Preis berechnen</button>
                <!--Leerer Absatz für das Erbegnis.-->
                <p id="ergebnis"></p>
            </div>

         

    <!--Ende des Inhalts-->
    </main>
    <!--footer: Fußbereich, auf allen Seiten gleich-->
    <footer>
        <p>&copy; 2026 Meine Webseite</p>
        <!--Ende des Fußbereichs-->
    </footer>
    <!--Ende des sichtbaren Bereichs-->
</body>
<!--Ende der Seite-->
</html>
