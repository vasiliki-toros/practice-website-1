    <h2>Kontakt</h2>
    <form id="Kontaktformular">
    <fieldset>
<legend>Ihre Kontaktdaten</legend>
  
     
      <label for ="vorname">Vorname</label>
      <input id ="vorname" type="text" placeholder="z.B. Max">

      <label for = "nachname">Nachname</label> 
      <input id="nachname" type = "text" placeholder = "z.B. Müller">
      
      <label for = "email">Email</label> 
      <input id="email" type = "email" placeholder = "max.mueller@email.de">

      <label for = "kursauswahl">Bitte Auswählen</label> 
      <select id="kursauswahl">
        <option value = "">bitte auswählen</option>
      </select>
      <label for = "nachricht">Nachricht an uns</label>
      <textarea id = "nachricht" rows = "5" type = "text" placeholder = "Hier Ihre Anfrage eingeben"></textarea>

        </fieldset>
        <button type="submit">Absenden</button> 
        <p id="formular_hinweis"></p>
  </form>
